name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

# Seguridad: permisos mínimos
permissions:
  contents: read

# Una ejecución por ref: un push nuevo cancela la anterior en ese mismo ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Fijar versiones de acciones por SHA (commit hash verificado por la API de
# GitHub; los SHA falsos hacen fallar el checkout antes de compilar).
# - actions/checkout v4.2.2
# - actions/setup-node v4.4.0
# - dtolnay/rust-toolchain stable (2026-10)
# - swatinem/rust-cache v2.8.0
# - actions/upload-artifact v4.6.0

jobs:
  lint-and-test:
    name: Lint & Test (Node + Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # cargo test compila la app Tauri completa: necesita webkit2gtk y GTK.
      - name: Dependencias de Linux
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (ignore scripts for security)
        run: npm ci --ignore-scripts

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: "./src-tauri -> target"

      - name: Run Rust tests
        run: cargo test --locked
        working-directory: ./src-tauri

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run frontend tests
        run: npm test

      - name: Run Rust clippy
        run: cargo clippy --locked -- -D warnings
        working-directory: ./src-tauri

      - name: Run cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
        working-directory: ./src-tauri

  build-android-debug:
    name: Build Android Debug APK
    needs: lint-and-test
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      # La APK solo incluye la experiencia de repaso. Tauri define además
      # TAURI_ENV_PLATFORM=android durante `tauri android build`.
      VITE_APP_MODE: flashcards
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Gradle 9.x (wrapper generado por tauri-cli 2.12) exige JVM 17+;
      # el runner ubuntu-22.04 trae Java 11 por defecto.
      - name: Setup Java 17 (Gradle)
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust toolchain + target Android
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: "./src-tauri -> target"

      - name: Configure Android NDK
        run: |
          NDK_DIR="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK_DIR" ]; then
            NDK_DIR="$(ls -d "${ANDROID_HOME:?}"/ndk/* 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            echo "No se encontró el Android NDK." >&2
            exit 1
          fi
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      # El proyecto Android se genera en CI (src-tauri/gen está en .gitignore).
      - name: Initialize Tauri Android project
        run: npm run tauri android init -- --ci

      # WebView anteriores a 140.0.7339.51.0 devuelve env(safe-area-inset-*)
      # en 0px. El parche inyecta las insets reales de Android para que la
      # barra de estado y la navegación no tapen la interfaz de repaso.
      - name: Patch Android safe-area insets
        run: npm run android:patch

      # `android init` crea el proyecto con los iconos por defecto de Tauri.
      # Hay que regenerarlos DESPUÉS del init para que se copien al proyecto
      # Android generado (gen/android/app/src/main/res).
      - name: Generate app icons for Android
        run: npm run tauri icon src-tauri/icons/icon-manifest.json

      - name: Verify Android launcher icons
        run: |
          RES="src-tauri/gen/android/app/src/main/res"
          test -f "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          grep -q 'ic_launcher_foreground' "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          grep -q '@color/ic_launcher_background' "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          grep -qi '#0e1c7e' "$RES/values/ic_launcher_background.xml"
          for f in ic_launcher.png ic_launcher_round.png ic_launcher_foreground.png; do
            test -f "$RES/mipmap-xxxhdpi/$f"
          done
          echo "Android launcher icons verified"

      # Con vaults SAF externos y diarios, un backup automático en la nube de
      # Android restauraría índices desincronizados: se fuerza allowBackup=false.
      # INTERNET se conserva porque el actualizador descarga latest.json y la APK;
      # instalación y almacenamiento siguen prohibidos (el usuario instala a mano).
      - name: Patch manifest (allowBackup=false, INTERNET required)
        run: |
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST"
          # La plantilla de Tauri NO trae allowBackup y <application> va solo
          # en su línea (atributos en las siguientes): se inserta ahí.
          if grep -q 'android:allowBackup' "$MANIFEST"; then
            sed -i 's/android:allowBackup="[a-z]*"/android:allowBackup="false"/' "$MANIFEST"
          else
            sed -i -E 's/^([[:space:]]*)<application[[:space:]]*$/\1<application android:allowBackup="false" /' "$MANIFEST"
          fi
          if ! grep -q 'android:allowBackup' "$MANIFEST"; then
            sed -i 's/<application /<application android:allowBackup="false" /' "$MANIFEST"
          fi
          grep -q 'android:allowBackup="false"' "$MANIFEST"
          grep -q 'android.permission.INTERNET' "$MANIFEST" || {
            echo "ERROR: la plantilla de Tauri no declara INTERNET; la actualización de Android no funcionaría." >&2
            exit 1
          }
          if grep -qE 'MANAGE_EXTERNAL_STORAGE|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|REQUEST_INSTALL_PACKAGES' "$MANIFEST"; then
            echo "ERROR: el manifiesto declara permisos de instalación o almacenamiento no permitidos." >&2
            exit 1
          fi
          echo "Manifest verificado:"
          grep -E 'allowBackup|uses-permission' "$MANIFEST"

      - name: Build debug APK
        run: npm run tauri android build -- --apk --debug --target aarch64

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: DEBUG-no-distribuir
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

  build-android-release:
    name: Build Android Release APK (signed)
    needs: lint-and-test
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      VITE_APP_MODE: flashcards
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # El nombre del artefacto no admite "/" y en workflow_dispatch el ref es
      # una rama (p. ej. ci/fix-signed-apk), no un tag.
      - name: Determine artifact name
        id: artifact
        run: |
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          echo "name=SinNotas-${SAFE_REF}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Gradle 9.x (wrapper generado por tauri-cli 2.12) exige JVM 17+;
      # el runner ubuntu-22.04 trae Java 11 por defecto.
      - name: Setup Java 17 (Gradle)
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust toolchain + target Android
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          workspaces: "./src-tauri -> target"

      - name: Configure Android NDK
        run: |
          NDK_DIR="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK_DIR" ]; then
            NDK_DIR="$(ls -d "${ANDROID_HOME:?}"/ndk/* 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            echo "No se encontró el Android NDK." >&2
            exit 1
          fi
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Initialize Tauri Android project
        run: npm run tauri android init -- --ci

      # WebView anteriores a 140.0.7339.51.0 devuelve env(safe-area-inset-*)
      # en 0px. El parche inyecta las insets reales de Android para que la
      # barra de estado y la navegación no tapen la interfaz de repaso.
      - name: Patch Android safe-area insets
        run: npm run android:patch

      # `android init` crea el proyecto con los iconos por defecto de Tauri.
      # Hay que regenerarlos DESPUÉS del init para que se copien al proyecto
      # Android generado (gen/android/app/src/main/res).
      - name: Generate app icons for Android
        run: npm run tauri icon src-tauri/icons/icon-manifest.json

      - name: Verify Android launcher icons
        run: |
          RES="src-tauri/gen/android/app/src/main/res"
          test -f "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          grep -q 'ic_launcher_foreground' "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          grep -q '@color/ic_launcher_background' "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          grep -qi '#0e1c7e' "$RES/values/ic_launcher_background.xml"
          for f in ic_launcher.png ic_launcher_round.png ic_launcher_foreground.png; do
            test -f "$RES/mipmap-xxxhdpi/$f"
          done
          echo "Android launcher icons verified"

      # Con vaults SAF externos y diarios, un backup automático en la nube de
      # Android restauraría índices desincronizados: se fuerza allowBackup=false.
      # INTERNET se conserva porque el actualizador descarga latest.json y la APK;
      # instalación y almacenamiento siguen prohibidos (el usuario instala a mano).
      - name: Patch manifest (allowBackup=false, INTERNET required)
        run: |
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST"
          # La plantilla de Tauri NO trae allowBackup y <application> va solo
          # en su línea (atributos en las siguientes): se inserta ahí.
          if grep -q 'android:allowBackup' "$MANIFEST"; then
            sed -i 's/android:allowBackup="[a-z]*"/android:allowBackup="false"/' "$MANIFEST"
          else
            sed -i -E 's/^([[:space:]]*)<application[[:space:]]*$/\1<application android:allowBackup="false" /' "$MANIFEST"
          fi
          if ! grep -q 'android:allowBackup' "$MANIFEST"; then
            sed -i 's/<application /<application android:allowBackup="false" /' "$MANIFEST"
          fi
          grep -q 'android:allowBackup="false"' "$MANIFEST"
          grep -q 'android.permission.INTERNET' "$MANIFEST" || {
            echo "ERROR: la plantilla de Tauri no declara INTERNET; la actualización de Android no funcionaría." >&2
            exit 1
          }
          if grep -qE 'MANAGE_EXTERNAL_STORAGE|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|REQUEST_INSTALL_PACKAGES' "$MANIFEST"; then
            echo "ERROR: el manifiesto declara permisos de instalación o almacenamiento no permitidos." >&2
            exit 1
          fi
          echo "Manifest verificado:"
          grep -E 'allowBackup|uses-permission' "$MANIFEST"

      # tauri-plugin-android-fs 2.0.1 fija compileSdk=34, mientras que
      # tauri-android 2.12 exige compilar contra API 36. Se alinea el build del
      # plugin en el registry de Cargo; no se cambia la app ni la dependencia.
      - name: Align android-fs plugin compileSdk
        run: |
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml
          PLUGIN_GRADLE="$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" \
            -path '*/tauri-plugin-android-fs-*/android/build.gradle.kts' -print -quit)"
          if [ -z "$PLUGIN_GRADLE" ]; then
            echo "ERROR: no se encontró el build.gradle.kts de tauri-plugin-android-fs" >&2
            exit 1
          fi
          sed -i -E 's/^([[:space:]]*compileSdk[[:space:]]*=[[:space:]]*)[0-9]+/\136/' "$PLUGIN_GRADLE"
          if ! grep -qE '^[[:space:]]*compileSdk[[:space:]]*=[[:space:]]*36' "$PLUGIN_GRADLE"; then
            echo "ERROR: no se pudo alinear compileSdk a 36 en $PLUGIN_GRADLE" >&2
            grep -n 'compileSdk' "$PLUGIN_GRADLE" >&2 || true
            exit 1
          fi
          echo "compileSdk del plugin android-fs alineado a 36."

      - name: Build release APK (unsigned)
        run: npm run tauri android build -- --apk --target aarch64

      # aapt2 no está en PATH en los runners: se resuelve igual que apksigner.
      - name: Locate Android build tools
        run: |
          BUILD_TOOLS="$(find "${ANDROID_HOME:?}/build-tools" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$BUILD_TOOLS" ] || [ ! -d "$BUILD_TOOLS" ]; then
            echo "ERROR: no se encontró ningún directorio en \$ANDROID_HOME/build-tools" >&2
            exit 1
          fi
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT2="$BUILD_TOOLS/aapt2"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          for tool in "$APKSIGNER" "$AAPT2" "$ZIPALIGN"; do
            if [ ! -x "$tool" ]; then
              echo "ERROR: no se encontró el ejecutable $tool" >&2
              exit 1
            fi
          done
          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"
          echo "AAPT2=$AAPT2" >> "$GITHUB_ENV"
          echo "ZIPALIGN=$ZIPALIGN" >> "$GITHUB_ENV"
          echo "Build tools: $BUILD_TOOLS"

      # Falla temprano y con un mensaje accionable. Solo se imprimen NOMBRES.
      - name: Verify signing secrets are present
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          missing=()
          for var in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!var:-}" ]; then
              missing+=("$var")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "ERROR: faltan secretos de firma: ${missing[*]}" >&2
            echo "Cargalos con gh secret set NOMBRE (ver docs/publicacion-apk-android.md)." >&2
            exit 1
          fi
          echo "Los 4 secretos de firma están definidos."

      # Los secretos se usan SOLO dentro de este paso: nunca a nivel de job.
      - name: Sign APK with apksigner (secrets only in this step)
        id: sign_apk
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          chmod 600 release.keystore

          mapfile -t UNSIGNED_APKS < <(find src-tauri/gen/android/app/build/outputs/apk \
            -path '*/release/*' -name '*.apk' -not -name '*-signed*')
          if [ "${#UNSIGNED_APKS[@]}" -ne 1 ]; then
            echo "ERROR: se esperaba exactamente 1 APK release sin firmar; encontrados ${#UNSIGNED_APKS[@]}:" >&2
            printf '  %s\n' "${UNSIGNED_APKS[@]}" >&2
            exit 1
          fi
          UNSIGNED_APK="${UNSIGNED_APKS[0]}"
          SIGNED_APK="${UNSIGNED_APK%.apk}-signed.apk"

          "${APKSIGNER:?APKSIGNER no está definido}" sign \
            --ks release.keystore \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$SIGNED_APK" \
            "$UNSIGNED_APK"

          "${APKSIGNER:?APKSIGNER no está definido}" verify --verbose --print-certs "$SIGNED_APK"
          echo "signed_apk=$SIGNED_APK" >> "$GITHUB_OUTPUT"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Remove temporary keystore
        if: always()
        run: rm -f release.keystore

      - name: Inspect signed APK manifest (security checks)
        run: |
          SIGNED_APK="${{ steps.sign_apk.outputs.signed_apk }}"
          "${ZIPALIGN:?ZIPALIGN no está definido}" -c -v 4 "$SIGNED_APK" > zipalign.txt
          echo "=== zipalign ==="
          tail -n 3 zipalign.txt

          "${AAPT2:?AAPT2 no está definido}" dump permissions "$SIGNED_APK" > permissions.txt
          echo "=== Permissions ==="
          cat permissions.txt

          if grep -qE "(MANAGE_EXTERNAL_STORAGE|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|REQUEST_INSTALL_PACKAGES)" permissions.txt; then
            echo "ERROR: Dangerous permission found in APK" >&2
            exit 1
          fi
          grep -q "android.permission.INTERNET" permissions.txt || {
            echo "ERROR: falta el permiso INTERNET en la APK" >&2
            exit 1
          }

          "${AAPT2:?AAPT2 no está definido}" dump xmltree "$SIGNED_APK" --file AndroidManifest.xml > manifest-dump.xml
          echo "=== Manifest ==="
          cat manifest-dump.xml

          # aapt2 xmltree imprime booleanos como (type 0x12)0x0/0xffffffff.
          if grep -qE 'android:debuggable.*(0xffffffff|=true|"true")' manifest-dump.xml; then
            echo "ERROR: Release APK is debuggable"
            exit 1
          fi
          if grep -qE 'android:usesCleartextTraffic.*(0xffffffff|=true|"true")' manifest-dump.xml; then
            echo "ERROR: Cleartext traffic enabled"
            exit 1
          fi
          grep -q 'android:allowBackup' manifest-dump.xml || {
            echo "ERROR: allowBackup no está declarado en el APK"
            exit 1
          }
          if grep -qE 'android:allowBackup.*(0xffffffff|=true|"true")' manifest-dump.xml; then
            echo "ERROR: allowBackup no es false"
            exit 1
          fi
          echo "All security checks passed"

      # Datos públicos del APK; nunca incluye secretos.
      - name: APK summary
        run: |
          SIGNED_APK="${{ steps.sign_apk.outputs.signed_apk }}"
          BADGING="$RUNNER_TEMP/badging.txt"
          "${AAPT2:?AAPT2 no está definido}" dump badging "$SIGNED_APK" > "$BADGING"

          if ! unzip -l "$SIGNED_APK" | grep -q 'lib/arm64-v8a/'; then
            echo "ERROR: el APK no contiene bibliotecas nativas arm64-v8a" >&2
            exit 1
          fi

          PKG_NAME="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" "$BADGING" | head -n 1)"
          VERSION_CODE="$(sed -n "s/^package: .*versionCode='\([^']*\)'.*/\1/p" "$BADGING" | head -n 1)"
          VERSION_NAME="$(sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p" "$BADGING" | head -n 1)"
          # build-tools 37 imprime "minSdkVersion:'…'"; otros, "sdkVersion:'…'".
          MIN_SDK="$(sed -n -E "s/^(minSdkVersion|sdkVersion):'([^']*)'.*/\2/p" "$BADGING" | head -n 1)"
          if [ -z "$MIN_SDK" ]; then
            MIN_SDK="$(grep -oE 'minSdkVersion\(0x0101020c\)=[0-9]+' manifest-dump.xml 2>/dev/null \
              | head -n 1 | cut -d= -f2)"
          fi
          TARGET_SDK="$(sed -n "s/^targetSdkVersion:'\([^']*\)'.*/\1/p" "$BADGING" | head -n 1)"
          PERMS="$(sed -n "s/^uses-permission: name='\([^']*\)'.*/- \`\1\`/p" "$BADGING")"
          [ -n "$PERMS" ] || PERMS="_ninguno_"
          # build-tools recientes imprimen "V3.0 Signer: certificate ...";
          # los antiguos, "Signer #1 certificate ...". Se aceptan ambos.
          FINGERPRINT="$("${APKSIGNER:?APKSIGNER no está definido}" verify --print-certs "$SIGNED_APK" 2>&1 \
            | grep -m1 'certificate SHA-256 digest:' | sed -E 's/.*certificate SHA-256 digest: *//')"
          if [ -z "$FINGERPRINT" ]; then
            echo "ERROR: no se pudo extraer la huella SHA-256 del certificado" >&2
            exit 1
          fi
          APK_SHA256="$(sha256sum "$SIGNED_APK" | awk '{print $1}')"

          # El resumen no debe publicarse con campos vacíos.
          for var in PKG_NAME VERSION_CODE VERSION_NAME MIN_SDK TARGET_SDK FINGERPRINT APK_SHA256; do
            if [ -z "${!var:-}" ]; then
              echo "ERROR: no se pudo extraer $var del APK firmado" >&2
              exit 1
            fi
          done

          {
            echo "## APK release firmado"
            echo ""
            echo "| Campo | Valor |"
            echo "| --- | --- |"
            echo "| Paquete | \`$PKG_NAME\` |"
            echo "| versionName | \`$VERSION_NAME\` |"
            echo "| versionCode | \`$VERSION_CODE\` |"
            echo "| minSdk | \`$MIN_SDK\` |"
            echo "| targetSdk | \`$TARGET_SDK\` |"
            echo "| Nativo arm64-v8a | sí |"
            echo "| SHA-256 del certificado | \`$FINGERPRINT\` |"
            echo "| SHA-256 del APK | \`$APK_SHA256\` |"
            echo ""
            echo "### Permisos declarados"
            echo ""
            echo "$PERMS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.sign_apk.outputs.signed_apk }}
          if-no-files-found: error
          retention-days: 90
